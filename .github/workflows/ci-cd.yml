name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m black --check .

      - name: Run linter
        run: python -m ruff check .

      - name: Run type checker
        run: python -m mypy .

      - name: Run tests
        run: python -m pytest -q

      - name: Run security checks
        run: python -m bandit -r src -q

      - name: Audit dependencies
        run: python -m pip_audit

  build:
    name: Build package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install build tools
        run: python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cloudflare-multi-cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Create pre-release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "cloudflare-multi-cli $GITHUB_REF_NAME" \
              --prerelease \
              --latest=false \
              --notes-file - <<'EOF'
          PreRelease de cloudflare-multi-cli.

          Primera versión pública del cliente multi-cuenta para Cloudflare.

          Incluye:
          - CLI generado para el catálogo completo de operaciones Cloudflare.
          - Cliente Python tipado con soporte multi-cuenta.
          - Requests genéricos y exportación JSON/TOON.
          - Operaciones S3 compatibles con Cloudflare R2.
          - Wheels y source distribution adjuntos a esta release.
          EOF
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "cloudflare-multi-cli $GITHUB_REF_NAME" \
              --notes-file - <<'EOF'
          PreRelease de cloudflare-multi-cli.

          Primera versión pública del cliente multi-cuenta para Cloudflare.

          Incluye:
          - CLI generado para el catálogo completo de operaciones Cloudflare.
          - Cliente Python tipado con soporte multi-cuenta.
          - Requests genéricos y exportación JSON/TOON.
          - Operaciones S3 compatibles con Cloudflare R2.
          - Wheels y source distribution adjuntos a esta release.
          EOF
          fi
